# Delivery targets for release artwork.
#
# These values are a best-effort snapshot and platforms change them without
# much warning. Treat this file as YOURS: edit it, add targets, correct sizes.
# Always sanity-check against whatever your distributor currently demands
# before a release goes out.
#
# Every target supports:
#   name       human label shown in reports
#   group      used by `--group` (dsp / social / web / archive)
#   width      output width in px
#   height     output height in px
#   format     jpeg | png
#   quality    JPEG quality (ignored for png)
#   min_source smallest master edge that may feed this target, in px.
#              This is COVERFORGE'S floor, not necessarily the platform's. It is
#              the point below which rendering the target would mean upscaling
#              or shipping something soft, so the target is skipped instead.
#              Several are deliberately stricter than what the store documents,
#              and each note says why. The web cover checker at docs/cover.html
#              reports the PLATFORM'S published minimum, so the two answer
#              different questions and will not always agree.
#   max_bytes  hard file-size ceiling; quality is walked down to fit
#   fit        cover (scale + centre crop) | pad (scale to fit + fill)
#   pad_style  blur | a #rrggbb colour. only used when fit = "pad"
#   notes      shown in `coverforge targets`
#   source     where the spec came from, so it can be re-checked

# Two constraints worth knowing, because they bite in opposite directions:
#   * CD Baby and TuneCore REJECT cover art larger than 3000x3000. Bigger is not
#     safer. Every dsp target here therefore tops out at 3000.
#   * TuneCore enforces the highest floor at 1600; other distributors sit at
#     1000-1400. Apple's artist-facing page now asks for 4000 while its delivery
#     spec says 1400 minimum and 3000 recommended, so master at 4000 and deliver
#     3000.

[meta]
reviewed = "2026-08"

[targets.bandcamp]
name = "Bandcamp"
group = "dsp"
width = 3000
height = 3000
format = "jpeg"
quality = 92
min_source = 1400
max_bytes = 10_000_000
fit = "cover"
notes = "1400px is the floor; Bandcamp upscales its own thumbnails from what you give it, so feed it 3000."
source = "https://get.bandcamp.help/hc/en-us/articles/23020723502231"

[targets.spotify]
name = "Spotify (via distributor)"
group = "dsp"
width = 3000
height = 3000
format = "jpeg"
quality = 92
min_source = 1600
max_bytes = 10_000_000
fit = "cover"
notes = "Spotify itself accepts 640 to 10000 and wants the highest you have. 1600 is the floor because TuneCore enforces it; other distributors sit at 1000-1400."
source = "https://support.spotify.com/us/artists/article/cover-art-requirements/"

[targets.apple_music]
name = "Apple Music"
group = "dsp"
width = 3000
height = 3000
format = "jpeg"
quality = 95
min_source = 3000
max_bytes = 30_000_000
fit = "cover"
notes = "Apple documents 1400 minimum and 3000 recommended, and its artist page asks for 4000. 3000 here because delivering the recommended size is the point of this target. Strictest of the DSPs: flattened RGB, no alpha, baseline (non-progressive) JPEG."
source = "https://help.apple.com/itc/musicspec/"

[targets.beatport]
name = "Beatport"
group = "dsp"
width = 3000
height = 3000
format = "jpeg"
quality = 92
min_source = 1400
max_bytes = 10_000_000
fit = "cover"
notes = "Beatport publishes no minimum, only a preferred 3000x3000, so the 1400 floor here is ours: below that a 3000px render is mostly invented pixels. It can reject art tagged above 72 DPI."
source = "https://greenroomsupport.beatport.com/hc/en-us/articles/19096342438164-What-size-release-cover-artwork-do-you-accept"

[targets.soundcloud]
name = "SoundCloud (on-platform upload)"
group = "dsp"
width = 1400
height = 1400
format = "jpeg"
quality = 90
min_source = 800
max_bytes = 2_000_000
fit = "cover"
notes = "The upload form takes 800px minimum but caps the file under 2MB, so this is the target most likely to need quality walked down. Distributing THROUGH SoundCloud is a different spec, see soundcloud_distro."
source = "https://help.soundcloud.com/hc/en-us/articles/46022345620123-Edit-and-customize-your-tracks"

[targets.soundcloud_distro]
name = "SoundCloud (digital distribution)"
group = "dsp"
width = 3000
height = 3000
format = "jpeg"
quality = 92
min_source = 3000
max_bytes = 10_000_000
fit = "cover"
notes = "SoundCloud for Artists distribution requires 3000x3000 and a perfect square, which is a different and stricter spec than the on-platform upload."
source = "https://help.soundcloud.com/hc/en-us/articles/40259650089243-Artwork-Guidelines-for-Digital-Distribution"

[targets.instagram_post]
name = "Instagram post (1:1)"
group = "social"
width = 1080
height = 1080
format = "jpeg"
quality = 90
min_source = 1080
max_bytes = 8_000_000
fit = "cover"
notes = "Square feed post."

[targets.instagram_story]
name = "Instagram story (9:16)"
group = "social"
width = 1080
height = 1920
format = "jpeg"
quality = 90
min_source = 1080
max_bytes = 8_000_000
fit = "pad"
pad_style = "blur"
notes = "Square art centred on a blurred blow-up of itself, so nothing gets cropped."

[targets.web_thumb]
name = "Web thumbnail"
group = "web"
width = 600
height = 600
format = "jpeg"
quality = 85
min_source = 600
max_bytes = 300_000
fit = "cover"
notes = "Label site / press listings."

[targets.archive]
name = "Flattened archive master"
group = "archive"
width = 3000
height = 3000
format = "png"
quality = 100
min_source = 3000
fit = "cover"
notes = "Lossless sRGB PNG to hand to a label or keep as the canonical delivered master."
