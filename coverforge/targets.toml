# Delivery targets for release artwork.
#
# These values are a best-effort snapshot and platforms change them without
# much warning. Treat this file as YOURS: edit it, add targets, correct sizes.
# Always sanity-check against whatever your distributor currently demands
# before a release goes out.
#
# Every target supports:
#   name       human label shown in reports
#   group      used by `--group` (dsp / social / web / archive)
#   width      output width in px
#   height     output height in px
#   format     jpeg | png
#   quality    JPEG quality (ignored for png)
#   min_source smallest master edge that may feed this target, in px
#   max_bytes  hard file-size ceiling; quality is walked down to fit
#   fit        cover (scale + centre crop) | pad (scale to fit + fill)
#   pad_style  blur | a #rrggbb colour. only used when fit = "pad"
#   notes      shown in `coverforge targets`
#   source     where the spec came from, so it can be re-checked

[meta]
reviewed = "2026-08"

[targets.bandcamp]
name = "Bandcamp"
group = "dsp"
width = 3000
height = 3000
format = "jpeg"
quality = 92
min_source = 1400
max_bytes = 10_000_000
fit = "cover"
notes = "1400px is the floor; Bandcamp upscales its own thumbnails from what you give it, so feed it 3000."
source = "https://get.bandcamp.help/hc/en-us/articles/23020723502231"

[targets.spotify]
name = "Spotify (via distributor)"
group = "dsp"
width = 3000
height = 3000
format = "jpeg"
quality = 92
min_source = 1600
max_bytes = 10_000_000
fit = "cover"
notes = "Most distributors reject anything under 3000x3000 even though Spotify itself renders far smaller."
source = "https://artists.spotify.com/help/article/image-guidelines"

[targets.apple_music]
name = "Apple Music"
group = "dsp"
width = 3000
height = 3000
format = "jpeg"
quality = 95
min_source = 3000
max_bytes = 30_000_000
fit = "cover"
notes = "Strictest of the DSPs: flattened RGB, no alpha, baseline (non-progressive) JPEG."
source = "https://help.apple.com/itc/musicspec/"

[targets.beatport]
name = "Beatport"
group = "dsp"
width = 1400
height = 1400
format = "jpeg"
quality = 92
min_source = 1400
max_bytes = 10_000_000
fit = "cover"
notes = "1400x1400 is both the minimum and what the store actually serves."
source = "https://support.beatport.com/"

[targets.soundcloud]
name = "SoundCloud"
group = "dsp"
width = 1400
height = 1400
format = "jpeg"
quality = 90
min_source = 800
max_bytes = 2_000_000
fit = "cover"
notes = "Hard 2MB upload cap - this is the target most likely to need quality walked down."
source = "https://help.soundcloud.com/"

[targets.instagram_post]
name = "Instagram post (1:1)"
group = "social"
width = 1080
height = 1080
format = "jpeg"
quality = 90
min_source = 1080
max_bytes = 8_000_000
fit = "cover"
notes = "Square feed post."

[targets.instagram_story]
name = "Instagram story (9:16)"
group = "social"
width = 1080
height = 1920
format = "jpeg"
quality = 90
min_source = 1080
max_bytes = 8_000_000
fit = "pad"
pad_style = "blur"
notes = "Square art centred on a blurred blow-up of itself, so nothing gets cropped."

[targets.web_thumb]
name = "Web thumbnail"
group = "web"
width = 600
height = 600
format = "jpeg"
quality = 85
min_source = 600
max_bytes = 300_000
fit = "cover"
notes = "Label site / press listings."

[targets.archive]
name = "Flattened archive master"
group = "archive"
width = 3000
height = 3000
format = "png"
quality = 100
min_source = 3000
fit = "cover"
notes = "Lossless sRGB PNG to hand to a label or keep as the canonical delivered master."
