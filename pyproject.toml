[project]
name = "coverforge"
version = "0.1.0"
description = "Preflight and delivery-pack builder for release artwork"
requires-python = ">=3.11"
dependencies = ["pillow>=10.0"]

[project.scripts]
coverforge = "coverforge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coverforge"]
