[project]
name = "coverforge"
version = "0.1.0"
description = "Preflight and delivery-pack builder for release artwork"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["pillow>=10.0"]
keywords = [
  "album-art",
  "cover-art",
  "artwork",
  "music-release",
  "image-processing",
  "preflight",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://gabs-utilities.com/"
Repository = "https://github.com/notgabriels-sys/albumdesign"
Issues = "https://github.com/notgabriels-sys/albumdesign/issues"

[project.scripts]
coverforge = "coverforge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coverforge"]

[tool.hatch.build.targets.sdist]
include = [
  "/coverforge",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
